# Published by pushing a `vX.Y.Z` tag. The monorepo is the source of truth: do not edit this file
# in the public repo.
#
# Packs the connector kit (the scripts + manifest.json + config.example.json, flat: it extracts as
# is into connectors-ext/csv_ps/ of the Thoth Engine) and creates the GitHub release with the zip,
# its checksums and a provenance attestation. Nothing to compile: the kit has no other version than
# its tag.

name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # OIDC token: provenance attestation
      attestations: write  # provenance attestation
    env:
      CONNECTOR_ID: csv_ps
      ASSET_PREFIX: thoth-connector-csv-ps
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the tag format
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a version tag (expected vX.Y.Z or vX.Y.Z-suffix)."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ZIP=$ASSET_PREFIX-$version.zip" >> "$GITHUB_ENV"
          if [[ "$version" == *-* ]]; then echo "PRERELEASE=true" >> "$GITHUB_ENV"; else echo "PRERELEASE=false" >> "$GITHUB_ENV"; fi

      - uses: actions/checkout@v7

      # Flat zip (-j), without variable metadata (-X).
      - name: Zip the kit
        run: |
          kit=(script.ps1 thoth-protocol.ps1 manifest.json config.example.json)
          for f in "${kit[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Kit file missing: $f."
              exit 1
            fi
          done
          zip -X -j "$ZIP" "${kit[@]}"

      - name: Checksums
        run: sha256sum -- "$ZIP" > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ZIP }}

      - name: Release notes
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          cat > notes.md <<EOF
          ## $repo $VERSION

          ### Installation

          Extract the archive into \`connectors-ext/$CONNECTOR_ID/\` under the Thoth Engine installation folder (\`C:\\inetpub\\Thoth\\connectors-ext\\$CONNECTOR_ID\\\` by default), then click **Refresh the connectors** in the Thoth console: no restart is needed. The archive holds no \`config.json\`, so extracting it over an existing folder keeps the operator's settings. To configure the connector, copy \`config.example.json\` to \`config.json\`. See https://thoth-iam.com/docs/en/connectors/#installation.

          ### Verification

          The archive was built from this tag by this repository's release workflow.

          - Checksum: \`sha256sum -c SHA256SUMS.txt\`, or in PowerShell \`Get-FileHash $ZIP -Algorithm SHA256\` and compare with \`SHA256SUMS.txt\`.
          - Provenance: \`gh attestation verify $ZIP --repo $GITHUB_REPOSITORY\`.
          EOF

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$ZIP" SHA256SUMS.txt \
            --title "${GITHUB_REPOSITORY#*/} $VERSION" --notes-file notes.md "${flags[@]}"
